{% extends "base.html" %}
{% block content %}
<section class="auth-shell">
    <div class="auth-photo register-photo">
        <div class="auth-caption">
            <p class="eyebrow">Start Your Journey</p>
            <h1>Create Your Account</h1>
            <p>Join Smart Fitness Planner and begin your fitness journey today.</p>
        </div>
    </div>

    <form class="form-panel auth-panel register-card" method="post">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <h2>Create Account</h2>

        <p class="muted">
            Fill in your details below.
        </p>

        <label>
            Full Name
            <input type="text" name="name" required>
        </label>

        <label>
            Email
            <input type="email" name="email" required>
        </label>

        <label>
            Password
            <input type="password" name="password" required minlength="8">
        </label>

        <label>
            Confirm Password
            <input type="password" name="confirm_password" required minlength="8">
        </label>

        <button type="submit">Create Account</button>

        <p class="muted auth-links">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>

    </form>
</section>
{% endblock %}
