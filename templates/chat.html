<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AI Fitness Voice Assistant</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

<style>

body{

margin:0;
font-family:'Segoe UI',sans-serif;

background:
linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);

min-height:100vh;

overflow-x:hidden;

}

.container{

max-width:1000px;

margin:35px auto;

}

.chat-card{

background:rgba(255,255,255,.08);

backdrop-filter:blur(15px);

border-radius:22px;

padding:25px;

box-shadow:0 15px 45px rgba(0,0,0,.35);

}

.chat-title{

color:white;

font-size:32px;

font-weight:bold;

}

.subtitle{

color:#dbeafe;

margin-bottom:20px;

}

#chat-box{

height:520px;

overflow-y:auto;

background:rgba(255,255,255,.07);

border-radius:18px;

padding:20px;

}

.user{

text-align:right;

margin:15px 0;

}

.bot{

text-align:left;

margin:15px 0;

}

.user span{

display:inline-block;

background:#2563eb;

color:white;

padding:14px 18px;

border-radius:18px;

max-width:75%;

}

.bot span{

display:inline-block;

background:#22c55e;

color:white;

padding:14px 18px;

border-radius:18px;

max-width:75%;

}

.bottom{

display:flex;

gap:10px;

margin-top:18px;

}

#message{

flex:1;

}

#language{

width:220px;

}

#micBtn{

width:230px;

}

.recording{

animation:pulse 1s infinite;

}

@keyframes pulse{

0%{transform:scale(1);}

50%{transform:scale(1.05);}

100%{transform:scale(1);}

}

.spinner{

display:none;

color:white;

margin-left:15px;

}

</style>

</head>

<body>

<div class="container">

<div class="chat-card">

<h2 class="chat-title">

AI Fitness Voice Assistant

</h2>

<div class="subtitle">

Talk naturally with your AI Fitness Coach.

</div>

<div class="row mb-3">

<div class="col-md-4">

<select
id="language"
class="form-select">

<option value="en">English</option>

<option value="hi">Hindi</option>

</select>

</div>

<div class="col-md-5">

<button
id="micBtn"
class="btn btn-danger w-100">

Start Speaking

</button>

</div>

<div class="col-md-3">

<div
id="status"
class="spinner">

Listening...

</div>

</div>

</div>

<div id="chat-box">

<div class="bot">

<span>

Hello! I am your AI Fitness Coach.

How can I help you today?

</span>

</div>

</div>

<div class="bottom">

<input
id="message"
class="form-control"
placeholder="Type your message...">

<button
id="sendBtn"
class="btn btn-primary">

<i class="fa-solid fa-paper-plane"></i>

</button>

</div>

</div>

</div>

<!-- JavaScript will be added in Part 2 -->
<script>

const csrfToken = "{{ csrf_token() }}";
const chatBox = document.getElementById("chat-box");
const messageInput = document.getElementById("message");
const sendBtn = document.getElementById("sendBtn");
const micBtn = document.getElementById("micBtn");
const language = document.getElementById("language");


let mediaRecorder;
let audioChunks = [];
let stream = null;
let isRecording = false;
let audioContext;
let analyser;
let microphone;
let vadInterval;
let silenceStart = null;


// ----------------------
// Add Message
// ----------------------

function addMessage(type, text){

    const div = document.createElement("div");
    const bubble = document.createElement("span");

    div.className = type;
    bubble.textContent = text;
    div.appendChild(bubble);

    chatBox.appendChild(div);

    chatBox.scrollTop = chatBox.scrollHeight;

}


// ----------------------
// Text To Speech
// ----------------------

function speakText(text){

    speechSynthesis.cancel();

    const utter = new SpeechSynthesisUtterance(text);

    utter.lang =
        language.value === "hi"
        ? "hi-IN"
        : "en-US";

    utter.rate = 1;

    speechSynthesis.speak(utter);

}


// ----------------------
// Send Message To Flask
// ----------------------

async function sendMessage(){

    const message = messageInput.value.trim();

    if(message==="") return;

    addMessage("user",message);

    messageInput.value="";

    try{

        const response = await fetch("/chat-api",{

            method:"POST",
            

            headers:{
                "Content-Type":"application/json",
                "X-CSRFToken": csrfToken
            },






            body:JSON.stringify({
                message:message,
                language:language.value
            })

        });

        const data = await response.json();

        if(!response.ok){
            throw new Error(data.reply || "Chat request failed.");
        }

        const reply = data.reply || "Sorry, I could not generate a reply right now. Please try again.";

        addMessage("bot",reply);

        speakText(reply);

    }

    catch(error){

        addMessage(
            "bot",
            "Sorry, I could not reach the AI assistant right now. Please try again."
        );

        console.error(error);

    }

}


// ----------------------
// Upload Audio
// ----------------------

async function uploadAudio(blob){

    const formData = new FormData();

    formData.append(
        "audio",
        blob,
        "voice.webm"
    );

    // Send selected language to Flask
    formData.append(
        "language",
        language.value
    );

    try{

        const response =
        await fetch(
            "/speech-to-text",
            {
                method:"POST",
                headers:{
                    "X-CSRFToken": csrfToken
                },
                body:formData
            }
        );

        const data =
        await response.json();

        if(data.text){

            messageInput.value =
            data.text;

            sendMessage();

        }

    }

    catch(error){

        console.log(error);

        alert("Speech recognition failed.");

    }

}


// ----------------------
// Start Recording
// ----------------------

async function startRecording(){

    try{

        stream = await navigator.mediaDevices.getUserMedia({
            audio:true
        });

        audioChunks = [];

        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = (event)=>{

            if(event.data.size>0){

                audioChunks.push(event.data);

            }

        };

        mediaRecorder.onstop = ()=>{

            const audioBlob = new Blob(
                audioChunks,
                {
                    type:"audio/webm"
                }
            );

            uploadAudio(audioBlob);

            stream.getTracks().forEach(track=>track.stop());
            clearInterval(vadInterval);

            if (audioContext) {

                audioContext.close();

            }

            micBtn.classList.remove("btn-success");

            micBtn.classList.add("btn-danger");

            micBtn.textContent="Start Speaking";

            isRecording=false;

        };

        mediaRecorder.start();
        startVoiceDetection();

        isRecording=true;

        micBtn.classList.remove("btn-danger");

        micBtn.classList.add("btn-success");

        micBtn.textContent="Listening...";

        // Temporary auto-stop after 6 seconds.
        // We'll replace this with true Voice Activity Detection next.
        

    }

    catch(error){

        console.log(error);

        alert("Microphone permission denied.");

    }

}

function startVoiceDetection() {

    audioContext = new AudioContext();

    analyser = audioContext.createAnalyser();

    analyser.fftSize = 2048;

    microphone = audioContext.createMediaStreamSource(stream);

    microphone.connect(analyser);

    const dataArray = new Uint8Array(analyser.fftSize);

    silenceStart = null;

    vadInterval = setInterval(() => {

        analyser.getByteTimeDomainData(dataArray);

        let sum = 0;

        for (let i = 0; i < dataArray.length; i++) {

            const value = (dataArray[i] - 128) / 128;

            sum += value * value;

        }

        const volume = Math.sqrt(sum / dataArray.length);

        // Adjust this threshold if needed
        if (volume < 0.015) {

            if (!silenceStart) {

                silenceStart = Date.now();

            }

            // Stop after 1.5 seconds of silence
            if (Date.now() - silenceStart > 1500) {

                clearInterval(vadInterval);

                if (
                    mediaRecorder &&
                    mediaRecorder.state === "recording"
                ) {

                    mediaRecorder.stop();

                }

            }

        } else {

            silenceStart = null;

        }

    }, 100);

}


// ----------------------
// Mic Button
// ----------------------

micBtn.addEventListener("click",()=>{

    if(isRecording){

        if(
            mediaRecorder &&
            mediaRecorder.state==="recording"
        ){

            mediaRecorder.stop();

        }

    }

    else{

        startRecording();

    }

});


// ----------------------
// Send Button
// ----------------------

sendBtn.addEventListener("click",sendMessage);


// ----------------------
// Press Enter
// ----------------------

messageInput.addEventListener("keypress",(e)=>{

    if(e.key==="Enter"){

        sendMessage();

    }

});

</script>

</body>

</html>
